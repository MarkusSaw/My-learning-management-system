databaseChangeLog:
  - changeSet:
      id: 1
      author: Markus_Saw
      changes:
        - createTable:
            tableName: timesheet
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: group_name
                  type: VARCHAR(255)
              - column:
                  name: teacher
                  type: VARCHAR(255)
              - column:
                  name: course
                  type: INT
              - column:
                  name: date_of_the_lesson
                  type: INT