spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/my_learning_db?currentSchema=management_system
    username: my_user
    password: my_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: management_system

  liquibase:
    enabled: true
    change-log: liquibase/db.changelog-master.yaml
    default-schema: management_system

  app:
    cleanup:
      cron: "0 0 0 1 1 ?"